name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # a throwaway database inside the CI job: no password needed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run schema.sql twice (it must be safe to re-run)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/test/auth-mock.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
